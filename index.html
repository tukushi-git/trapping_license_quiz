    <!-- Header Navigation -->

    <!-- Main Container -->

        <!-- Quiz Card -->

                <div class="flex justify-between items-center text-xs md:text-sm font-bold text-slate-500 mb-2">
                    <!-- Question Counter -->
                    <span id="question-number" class="text-sky-600 bg-sky-100 px-2.5 py-0.5 rounded-full">だい 4 もん</span>
                    
                    <!-- Real-time Accuracy Rate Display -->
                    <div class="flex items-center space-x-1 bg-amber-50 text-amber-700 px-3 py-0.5 rounded-full border border-amber-200 shadow-sm">
                        <i class="fa-solid fa-bullseye text-amber-500"></i>

            <!-- Question Screen -->

                    <span>4</span>

                </button><button class="option-btn w-full bg-slate-50 text-slate-700 border-2 border-slate-200 font-extrabold text-xl md:text-2xl py-3.5 md:py-4 px-6 rounded-2xl transition duration-150 transform shadow-sm flex items-center justify-between group opacity-50" disabled="">

                <!-- Next Button -->

            <!-- Result Screen (Hidden initially) -->

                <!-- Result Stats Board -->
                <div class="bg-gradient-to-b from-sky-50 to-indigo-50 border-2 border-sky-100 rounded-2xl p-6 mb-6 shadow-inner">
                    <div class="grid grid-cols-2 gap-4 divide-x divide-sky-200">
                        <div>
                            <div class="text-slate-500 text-xs font-bold mb-1">せいかいすう</div>
                            <div class="text-4xl font-black text-sky-600" id="final-score">1 / 4</div>
                        </div>
                        <div>
                            <div class="text-slate-500 text-xs font-bold mb-1">さいしゅう正解率</div>
                            <div class="text-4xl font-black text-amber-600" id="final-accuracy">25%</div>

                    </div>
                    <div class="text-sm text-sky-700 font-black mt-4 pt-3 border-t border-sky-200/60" id="score-comment">なんども ちょうせんして まんてんを めざそう！</div>
                </div>

                <!-- Restart Button -->
                <button onclick="restartQuiz()" class="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-extrabold py-4 rounded-2xl shadow-lg transition duration-200 flex items-center justify-center space-x-2 text-lg pulse-subtle active:scale-95">

            <!-- Modal Header -->

    <!-- JavaScript Application Logic -->
    <script>
        // Quiz Question Dataset
        const quizData = [
            {
                num1: 1,
                num2: 1,
                options: [2, 3, 4, 1],
                answer: 2,
                explanation: "1 に 1 をあわせると 2 になるよ！"
            },
            {
                num1: 2,
                num2: 1,
                options: [2, 3, 4, 5],
                answer: 3,
                explanation: "2 に 1 をあわせると 3 になるよ！"
            },
            {
                num1: 1,
                num2: 3,
                options: [3, 5, 4, 2],
                answer: 4,
                explanation: "1 に 3 をあわせると 4 になるよ！"
            },
            {
                num1: 2,
                num2: 2,
                options: [3, 4, 5, 6],
                answer: 4,
                explanation: "2 に 2 をあわせると 4 になるよ！"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answeredQuestionsCount = 0;
        let isAnswered = false;

        // Sound Synthesis (Web Audio API - No external audio files needed)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Correct Chime Sound
        function playCorrectSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                
                // Two-tone chime (E5 -> A5)
                osc.frequency.setValueAtTime(659.25, now);
                osc.frequency.setValueAtTime(880.00, now + 0.12);
                
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.45);
            } catch(e) {
                console.log("Audio play error", e);
            }
        }

        // Incorrect Sound
        function playWrongSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.setValueAtTime(120, now + 0.15);
                
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            } catch(e) {
                console.log("Audio play error", e);
            }
        }

        // Fanfare Sound for Completion
        function playFanfareSound() {
            try {
                const ctx = getAudioContext();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const now = ctx.currentTime + idx * 0.1;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (idx === 3 ? 0.6 : 0.2));
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + (idx === 3 ? 0.6 : 0.2));
                });
            } catch(e) {}
        }

        // Initialize App
        window.onload = function() {
            loadQuestion();
        };

        // Update Header Accuracy Rate Badge
        function updateAccuracyDisplay() {
            const accuracyEl = document.getElementById('accuracy-rate');
            if (answeredQuestionsCount === 0) {
                accuracyEl.textContent = '-- %';
            } else {
                const percentage = Math.round((score / answeredQuestionsCount) * 100);
                accuracyEl.textContent = `${percentage}%`;
            }
        }

        // Load Question Logic
        function loadQuestion() {
            isAnswered = false;
            const q = quizData[currentQuestionIndex];

            // Progress Header
            const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('question-number').textContent = `だい ${currentQuestionIndex + 1} もん`;
            document.getElementById('progress-text').textContent = `${currentQuestionIndex + 1} / ${quizData.length}`;

            // Realtime Accuracy Rate
            updateAccuracyDisplay();

            // Question Text
            document.getElementById('question-text').textContent = `${q.num1} + ${q.num2} = ?`;

            // Reset UI
            document.getElementById('feedback-area').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            // Render Vertical 4 Options Grid
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            q.options.forEach(option => {
                const button = document.createElement('button');
                button.className = `option-btn w-full bg-slate-50 hover:bg-sky-50 text-slate-700 border-2 border-slate-200 hover:border-sky-300 font-extrabold text-xl md:text-2xl py-3.5 md:py-4 px-6 rounded-2xl transition duration-150 transform active:scale-98 shadow-sm flex items-center justify-between group`;
                button.innerHTML = `
                    <span>${option}</span>
                    <i class="fa-regular fa-circle text-slate-300 group-hover:text-sky-400 text-lg transition"></i>
                `;
                button.onclick = () => selectOption(button, option);
                optionsGrid.appendChild(button);
            });

            // Trigger Pop animation
            const qScreen = document.getElementById('question-screen');
            qScreen.classList.remove('pop-in');
            void qScreen.offsetWidth; // trigger reflow
            qScreen.classList.add('pop-in');
        }

        // Option Selection Event Handler
        function selectOption(selectedBtn, selectedVal) {
            if (isAnswered) return;
            isAnswered = true;

            answeredQuestionsCount++;
            const q = quizData[currentQuestionIndex];
            const isCorrect = selectedVal === q.answer;

            if (isCorrect) {
                score++;
                playCorrectSound();
            } else {
                playWrongSound();
            }

            // Update Realtime Accuracy Rate Header immediately
            updateAccuracyDisplay();

            const buttons = document.querySelectorAll('.option-btn');

            // Button Highlight Updates
            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-sky-50', 'hover:border-sky-300', 'active:scale-98');
                
                const optionVal = parseInt(btn.querySelector('span').textContent);
                const icon = btn.querySelector('i');

                if (optionVal === q.answer) {
                    btn.className += ' bg-emerald-100 border-emerald-500 text-emerald-800 font-bold';
                    if (icon) icon.className = 'fa-solid fa-circle-check text-emerald-600 text-xl';
                } else if (btn === selectedBtn && !isCorrect) {
                    btn.className += ' bg-rose-100 border-rose-400 text-rose-700';
                    if (icon) icon.className = 'fa-solid fa-circle-xmark text-rose-500 text-xl';
                } else {
                    btn.className += ' opacity-50';
                    if (icon) icon.className = 'fa-regular fa-circle text-slate-300 text-lg';
                }
            });

            // Feedback Display
            const feedbackArea = document.getElementById('feedback-area');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackMsg = document.getElementById('feedback-message');
            const feedbackExp = document.getElementById('feedback-explanation');

            feedbackArea.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-800', 'bg-rose-50', 'border-rose-200', 'text-rose-800');

            if (isCorrect) {
                feedbackArea.classList.add('bg-emerald-50', 'border-2', 'border-emerald-200', 'text-emerald-800');
                feedbackIcon.textContent = '🎉';
                feedbackMsg.textContent = 'せいかい！';
            } else {
                feedbackArea.classList.add('bg-rose-50', 'border-2', 'border-rose-200', 'text-rose-800');
                feedbackIcon.textContent = '😅';
                feedbackMsg.textContent = 'ざんねん！';
            }

            feedbackExp.textContent = q.explanation;

            // Show Next Button
            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.querySelector('span').textContent = 'けっかを見る';
            } else {
                nextBtn.querySelector('span').textContent = 'つぎの問題へ';
            }
            nextBtn.classList.remove('hidden');
        }

        // Advance Question
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Final Results Display & Confetti
        function showResults() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const finalAccuracyPct = Math.round((score / quizData.length) * 100);

            document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;
            document.getElementById('final-accuracy').textContent = `${finalAccuracyPct}%`;

            const commentEl = document.getElementById('score-comment');
            const emojiEl = document.getElementById('result-emoji');

            if (score === quizData.length) {
                emojiEl.textContent = '🏆';
                commentEl.textContent = 'すごーい！ぜんぶ せいかいです！まんてん！';
                playFanfareSound();
                triggerConfetti();
            } else if (finalAccuracyPct >= 50) {
                emojiEl.textContent = '👏';
                commentEl.textContent = 'よくがんばりました！あとすこし！';
                playFanfareSound();
            } else {
                emojiEl.textContent = '💪';
                commentEl.textContent = 'なんども ちょうせんして まんてんを めざそう！';
            }
        }

        // Canvas Confetti Effect
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }

        // Restart Quiz
        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            answeredQuestionsCount = 0;
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            loadQuestion();
        }

        // Open Source Code Modal
        function openCodeModal() {
            const codeDisplay = document.getElementById('code-display');
            codeDisplay.textContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            document.getElementById('code-modal').classList.remove('hidden');
        }

        // Close Source Code Modal
        function closeCodeModal() {
            document.getElementById('code-modal').classList.add('hidden');
            document.getElementById('copy-toast').classList.add('hidden');
        }

        // Copy Code to Clipboard
        function copyCode() {
            const codeText = document.getElementById('code-display').textContent;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(codeText).then(showCopyToast);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = codeText;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopyToast();
                } catch (err) {
                    console.error('Copy failed', err);
                }
                document.body.removeChild(textArea);
            }
        }

        function showCopyToast() {
            const toast = document.getElementById('copy-toast');
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>

</body></html>
