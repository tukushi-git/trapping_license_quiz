<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クイズに挑戦</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');
    body { font-family: 'M PLUS Rounded 1c', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 text-slate-800">

  <div class="w-full max-w-md mx-auto">
    <!-- クイズ画面 -->
    <div id="quiz-screen" class="bg-white rounded-3xl shadow-xl p-6 md:p-8">
      <!-- ヘッダーナビ -->
      <div class="flex items-center justify-between mb-4">
        <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-indigo-600 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full transition-all flex items-center gap-1">
          <i class="fa-solid fa-house"></i> メニューへ戻る
        </a>
        <div class="bg-indigo-50 border border-indigo-200 text-indigo-700 font-extrabold px-3 py-1 rounded-full text-xs flex items-center gap-1.5">
          <span>🎯 せいかいりつ:</span>
          <span id="accuracy-badge">-- %</span>
        </div>
      </div>

      <!-- 進捗メーター -->
      <div class="mb-6">
        <div class="flex justify-between text-xs font-bold text-slate-400 mb-1">
          <span id="progress-text">もんだい 1 / --</span>
          <span id="mode-title-badge" class="font-extrabold text-indigo-600">クイズ</span>
        </div>
        <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>

      <!-- 問題カード -->
      <div class="bg-slate-50 border border-slate-100 rounded-2xl p-6 text-center mb-6 shadow-inner">
        <!-- 問題用画像エリア -->
        <div id="question-image-container" class="hidden mb-4 overflow-hidden rounded-xl border border-slate-200 bg-white">
          <img id="question-image" src="" alt="問題画像" class="w-full max-h-48 object-contain mx-auto p-2">
        </div>
        <!-- 問題文 -->
        <div id="question-text" class="text-3xl md:text-4xl font-extrabold text-slate-800 tracking-wider">読み込み中...</div>
      </div>

      <!-- 縦4列選択肢 -->
      <div id="options-container" class="space-y-3 mb-6"></div>

      <!-- 解説表示領域 -->
      <div id="explanation-box" class="hidden rounded-xl p-4 mb-4 text-sm font-bold">
        <div id="explanation-title" class="flex items-center gap-2 mb-1 text-base"></div>
        <div id="explanation-text" class="text-slate-600 font-normal"></div>
      </div>

      <!-- 次へボタン -->
      <button id="next-btn" onclick="nextQuestion()" class="hidden w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all text-center">
        つぎのもんだいへ <i class="fa-solid fa-arrow-right ml-1"></i>
      </button>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden bg-white rounded-3xl shadow-xl p-6 md:p-8 text-center">
      <div class="text-5xl mb-3">🎉</div>
      <h2 class="text-2xl font-black text-slate-800 mb-1">おつかれさまでした！</h2>
      <p class="text-xs text-slate-400 mb-6">クイズがすべておわったよ</p>

      <div class="bg-slate-50 rounded-2xl p-4 mb-6 border border-slate-100 grid grid-cols-2 gap-4">
        <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
          <div class="text-xs text-slate-400 font-bold">せいかいすう</div>
          <div class="text-2xl font-black text-indigo-600 mt-1"><span id="final-score">0</span> / <span id="final-total">0</span></div>
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
          <div class="text-xs text-slate-400 font-bold">せいかいりつ</div>
          <div class="text-2xl font-black text-emerald-600 mt-1" id="final-accuracy">0%</div>
        </div>
      </div>

      <div class="space-y-3">
        <button onclick="restartQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all">
          <i class="fa-solid fa-rotate-right mr-1"></i> もういちど挑戦する
        </button>
        <a href="index.html" class="block w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl transition-all">
          <i class="fa-solid fa-house mr-1"></i> メニューへ戻る
        </a>
      </div>
    </div>
  </div>

  <script>
    const modeTitles = {
      addition: "たしざん",
      subtraction: "ひきざん",
      multiplication: "かけざん",
      division: "わりざん"
    };

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    // Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(110, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'clear') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, now + idx * 0.1);
          g.gain.setValueAtTime(0.2, now + idx * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
          o.start(now + idx * 0.1);
          o.stop(now + idx * 0.1 + 0.3);
        });
      }
    }

    // 初期化：URLから mode を取得し、対応するJSONを読み込む
    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get('mode') || 'addition';
      
      document.getElementById('mode-title-badge').innerText = modeTitles[mode] || "クイズ";

      const jsonFileName = `questions_${mode}.json`;

      try {
        const res = await fetch(jsonFileName);
        if (!res.ok) throw new Error('File not found');
        questions = await res.json();
        renderQuestion();
      } catch (err) {
        document.getElementById('question-text').innerText = "問題ファイルの読み込みに失敗しました";
        console.error(err);
      }
    });

    function updateAccuracyBadge() {
      const badge = document.getElementById('accuracy-badge');
      if (currentIndex === 0 && !answered) {
        badge.innerText = '-- %';
      } else {
        const attempted = answered ? currentIndex + 1 : currentIndex;
        const rate = attempted > 0 ? Math.round((score / attempted) * 100) : 0;
        badge.innerText = `${rate}%`;
      }
    }

    function renderQuestion() {
      answered = false;
      const q = questions[currentIndex];

      document.getElementById('progress-text').innerText = `もんだい ${currentIndex + 1} / ${questions.length}`;
      const progressPercent = (currentIndex / questions.length) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;

      updateAccuracyBadge();

      // 画像の表示・非表示制御
      const imgContainer = document.getElementById('question-image-container');
      const imgElement = document.getElementById('question-image');

      if (q.image && q.image.trim() !== "") {
        imgElement.src = q.image;
        imgContainer.classList.remove('hidden');
      } else {
        imgContainer.classList.add('hidden');
        imgElement.src = "";
      }

      // 問題文表示
      document.getElementById('question-text').innerText = q.question;

      // 選択肢表示
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.onclick = () => checkAnswer(opt, btn);
        btn.className = "w-full flex items-center justify-between p-4 bg-white border-2 border-slate-200 rounded-2xl hover:border-indigo-400 hover:bg-indigo-50/30 text-left font-bold text-lg text-slate-700 transition-all shadow-sm active:scale-[0.99]";
        
        btn.innerHTML = `
          <span>${opt}</span>
          <div class="w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center icon-indicator">
            <div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
          </div>
        `;
        container.appendChild(btn);
      });

      document.getElementById('explanation-box').classList.add('hidden');
      document.getElementById('next-btn').classList.add('hidden');
    }

    function checkAnswer(selectedOpt, clickedBtn) {
      if (answered) return;
      answered = true;

      const q = questions[currentIndex];
      const isCorrect = String(selectedOpt) === String(q.answer);

      const buttons = document.getElementById('options-container').querySelectorAll('button');

      buttons.forEach(btn => {
        btn.disabled = true;
        btn.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50/30');
        const optText = btn.querySelector('span').innerText;

        if (String(optText) === String(q.answer)) {
          btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-800');
          const indicator = btn.querySelector('.icon-indicator');
          indicator.className = "w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs";
          indicator.innerHTML = '<i class="fa-solid fa-check"></i>';
        } else if (btn === clickedBtn && !isCorrect) {
          btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-800');
          const indicator = btn.querySelector('.icon-indicator');
          indicator.className = "w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs";
          indicator.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        } else {
          btn.classList.add('opacity-50');
        }
      });

      const expBox = document.getElementById('explanation-box');
      const expTitle = document.getElementById('explanation-title');
      const expText = document.getElementById('explanation-text');

      if (isCorrect) {
        score++;
        playSound('correct');
        expBox.className = "rounded-xl p-4 mb-4 text-sm font-bold bg-emerald-50 border border-emerald-200 text-emerald-900";
        expTitle.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i> せいかい！';
      } else {
        playSound('wrong');
        expBox.className = "rounded-xl p-4 mb-4 text-sm font-bold bg-rose-50 border border-rose-200 text-rose-900";
        expTitle.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-600 text-lg"></i> ざんねん…';
      }

      expText.innerText = q.explanation || '';
      expBox.classList.remove('hidden');

      updateAccuracyBadge();
      document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      document.getElementById('final-score').innerText = score;
      document.getElementById('final-total').innerText = questions.length;

      const rate = Math.round((score / questions.length) * 100);
      document.getElementById('final-accuracy').innerText = `${rate}%`;

      if (rate === 100) {
        playSound('clear');
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      renderQuestion();
    }
  </script>
</body>
</html>
